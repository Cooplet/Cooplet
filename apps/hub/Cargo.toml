[package]
name = "cooplet-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "cooplet-hub"

[[bin]]
name = "cooplet-hub"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
cooplet-client = { path = "../../packages/cooplet-client" }
cooplet-platform = { path = "../../packages/cooplet-platform" }
cooplet-protocol = { path = "../../packages/cooplet-protocol" }
cooplet-storage = { path = "../../packages/cooplet-storage" }
futures-core = { workspace = true }
futures-util = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
percent-encoding = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
