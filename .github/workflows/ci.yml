name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.0

      - name: Prepare pinned tools and dependencies
        run: make setup

      - name: Verify and build
        run: |
          make doctor
          make check
          make test
          make build
          make check package=workflow-sdk
          make exec toolchain=rust network=none command='cargo clippy --workspace --all-targets --locked --offline -- -D warnings'

      - name: Report source size
        if: always()
        continue-on-error: true
        run: python3 scripts/report_loc_stats.py
